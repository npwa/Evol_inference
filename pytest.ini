[pytest]
pythonpath = .
testpaths = tests
markers =
    gpu: needs a CUDA device and the local Phi-3 model (tier T1)
    llamacpp: needs a built llama.cpp / gguf tooling on PATH (tier T1+)
    arm_emulated: needs aarch64 cross toolchain + QEMU (tier T2)
    arm_native: must run on real Arm hardware (tiers T3/T4)
    mac_only: needs macOS + powermetrics (tier T4)
    slow: minutes-long real-model test (e.g. 8B GGUF re-quantization)
